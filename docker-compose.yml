
services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Relational Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: spendguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendguard_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-spendguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendguard -d spendguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Store
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: spendguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # NestJS Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: spendguard-backend
    restart: unless-stopped

    # Load backend secrets and configuration from server/.env
    env_file:
      - ./server/.env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0

      DATABASE_URL: postgresql://${POSTGRES_USER:-spendguard}:${POSTGRES_PASSWORD:-spendguard_secure_password}@postgres:5432/${POSTGRES_DB:-spendguard}?schema=public

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d

      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

      # Frontend BFF proxy configuration
      TRUST_PROXY: ${TRUST_PROXY:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}

      GATEWAY_FAIL_CLOSED_ON_ERROR: "true"
      GATEWAY_PROXY_TIMEOUT_MS: "60000"

      # Optional integrations
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

    ports:
      - "4000:4000"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Next.js 16 Frontend & BFF Layer
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: spendguard-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://backend:4000

    ports:
      - "3000:3000"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

# ----------------------------------------------------------------------------
# Persistent Volumes
# ----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
